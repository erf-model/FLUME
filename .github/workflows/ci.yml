name: CI

# Runs on every pull request, so a change that breaks a build or a test shows
# up on the PR and not after it merges. FLUME's own sources are compiled with
# warnings as errors (FLUME_WERROR=ON) in every CPU job.
#
# Only two submodules are needed: ERF, and the AMReX that ERF pins. ERF's other
# submodules are not fetched.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: "500M"

jobs:
  # ---------------------------------------------------------------------
  # CPU with MPI, double precision: build, then every test. The tests run
  # on 1, 2 and 4 ranks, so Open MPI gets --oversubscribe. GCC on Linux
  # traps invalid floating-point operations (amrex.fpe_trap_invalid=1 in
  # every test). The Debug row also turns on AMReX's assertions and
  # signalling-NaN fills (FLUME_TESTING=ON).
  # ---------------------------------------------------------------------
  cpu:
    name: CPU ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc Release
            compiler: gcc
            build_type: Release
            flags: ""
          - name: clang Release
            compiler: clang
            build_type: Release
            flags: ""
          - name: gcc Release OpenMP
            compiler: gcc
            build_type: Release
            flags: "-DFLUME_OMP=ON"
          - name: gcc Debug with AMReX testing
            compiler: gcc
            build_type: Debug
            flags: "-DFLUME_TESTING=ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: AMReX from the ERF submodule
        run: git -C Submodules/ERF submodule update --init --depth 1 Submodules/AMReX

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libomp-dev cmake ninja-build ccache \
            libopenmpi-dev openmpi-bin

      - name: Set up ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
            export OMPI_CC=clang OMPI_CXX=clang++
            # The tests trap invalid operations. Clang assumes traps are off
            # unless told otherwise; gcc's default is -ftrapping-math.
            export CXXFLAGS=-ffp-exception-behavior=maytrap
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DFLUME_MPI=ON \
            -DFLUME_WERROR=ON \
            -DFLUME_MPIEXEC_PREFLAGS=--oversubscribe \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.flags }}

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Tests
        env:
          OMP_NUM_THREADS: "2"
        run: ctest --test-dir build-ci --output-on-failure

      # Tests write only under build-ci/, which is ignored; anything else
      # they leave behind would land in a commit.
      - name: Working tree stays clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build or the tests left files behind:"
            git status --porcelain
            exit 1
          fi

      - name: ccache stats
        if: always()
        run: ccache -s

  # ---------------------------------------------------------------------
  # No MPI, single precision: build, then the tests that need one rank.
  # ---------------------------------------------------------------------
  serial-single:
    name: No MPI, single precision
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: AMReX from the ERF submodule
        run: git -C Submodules/ERF submodule update --init --depth 1 Submodules/AMReX

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      - name: Set up ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-serial-single-${{ github.sha }}
          restore-keys: ccache-serial-single-

      - name: Configure and build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLUME_MPI=OFF \
            -DFLUME_PRECISION=SINGLE \
            -DFLUME_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-ci --parallel

      - name: Tests
        run: ctest --test-dir build-ci --output-on-failure

  # ---------------------------------------------------------------------
  # CUDA: compile only. Hosted runners have no GPU. A device lambda that
  # captures `this` or a host container is a compile error under nvcc and
  # invisible to a CPU build; this job catches it.
  # ---------------------------------------------------------------------
  cuda:
    name: CUDA (compile only)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: AMReX from the ERF submodule
        run: git -C Submodules/ERF submodule update --init --depth 1 Submodules/AMReX

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'
          method: 'network'
          use-github-cache: 'false'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build
          cmake --version   # the runner image's CMake; apt's 3.22 is too old

      - name: Configure and build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLUME_MPI=OFF \
            -DFLUME_GPU_BACKEND=CUDA \
            -DCMAKE_CUDA_ARCHITECTURES=90
          cmake --build build-ci --parallel

  # ---------------------------------------------------------------------
  # HIP (AMD, gfx90a) and SYCL (Intel): compile only.
  # ---------------------------------------------------------------------
  hip:
    name: HIP gfx90a (compile only)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: AMReX from the ERF submodule
        run: git -C Submodules/ERF submodule update --init --depth 1 Submodules/AMReX

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build wget gnupg
          cmake --version   # the runner image's CMake; apt's 3.22 is too old

      - name: Add the ROCm apt repository
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.3.2 jammy main' \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -qq

      - name: Install ROCm/HIP
        run: |
          sudo apt-get install -y --no-install-recommends \
            rocm-dev rocrand-dev hiprand-dev rocprim-dev

      - name: Configure and build
        run: |
          export PATH=/opt/rocm/llvm/bin:/opt/rocm/bin:$PATH
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(which clang)" \
            -DCMAKE_CXX_COMPILER="$(which clang++)" \
            -DFLUME_MPI=OFF \
            -DFLUME_GPU_BACKEND=HIP \
            -DAMReX_AMD_ARCH=gfx90a
          cmake --build build-ci --parallel

  sycl:
    name: SYCL (compile only)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: AMReX from the ERF submodule
        run: git -C Submodules/ERF submodule update --init --depth 1 Submodules/AMReX

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build wget gnupg
          cmake --version   # the runner image's CMake; apt's 3.22 is too old

      - name: Add the Intel oneAPI apt repository
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -qq

      # AMReX's SYCL random numbers use oneMKL (headers and -qmkl).
      - name: Install the Intel DPC++ compiler and oneMKL
        run: |
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel

      - name: Configure and build
        shell: bash
        run: |
          set +e; source /opt/intel/oneapi/setvars.sh; set -e
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(which icx)" \
            -DCMAKE_CXX_COMPILER="$(which icpx)" \
            -DFLUME_MPI=OFF \
            -DFLUME_GPU_BACKEND=SYCL
          cmake --build build-ci --parallel
