name: Style

# Spelling, tabs and trailing whitespace on FLUME's own files, and a check of
# the workflow files themselves. Nothing here compiles. Submodules/ is not
# checked out, so ERF's files are not checked.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespell:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Settings: .codespellrc
      - name: codespell
        run: |
          python -m pip install codespell
          codespell

  whitespace:
    name: Tabs and trailing whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # LICENSE.md and copyright.txt stay byte-identical to ERF's.
      - name: No trailing whitespace
        run: |
          # git grep: 0 = found, 1 = none, above 1 = git itself failed
          status=0
          git grep -nI '[[:space:]]$' -- ':!LICENSE.md' ':!copyright.txt' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Trailing whitespace on the lines above."
            exit 1
          elif [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: No tabs
        run: |
          status=0
          git grep -nI "$(printf '\t')" -- ':!LICENSE.md' ':!copyright.txt' ':!*Makefile' ':!.gitmodules' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Tabs on the lines above."
            exit 1
          elif [ "$status" -gt 1 ]; then
            exit "$status"
          fi

  actionlint:
    name: Workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck (actionlint uses it on run blocks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"

      - name: actionlint
        env:
          # SC2086 (unquoted expansions) at info level is noise in these scripts
          SHELLCHECK_OPTS: -S warning
        run: ./actionlint -color
